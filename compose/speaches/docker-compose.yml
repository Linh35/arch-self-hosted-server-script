# Speaches — self-hosted speech-to-text (and TTS) server with an OpenAI-compatible
# API and a built-in web UI. Reach it at stt.<domain> or http://<server-ip>:8093.
#
# Engine: faster-whisper (CTranslate2). This box is CPU-only (Ryzen 5 PRO 2400GE,
# AVX2, no GPU), so we run the `-cpu` image with int8 quantisation — the right
# trade for Whisper on CPU. Bulgarian (and ~99 other languages) work out of the
# box; the default model is faster-whisper *medium* (good Bulgarian accuracy,
# slower-than-real-time on this 4-core CPU — fine for upload/batch and iPhone
# Shortcut use). Bump/shrink with WHISPER_MODEL in .env.
#
# iPhone: the OpenAI-compatible endpoint is the point of picking Speaches — an
# Apple Shortcut can POST a recording to
#   https://stt.<domain>/v1/audio/transcriptions
# (multipart: file=<audio>, model=$WHISPER_MODEL, language=bg, response_format=text)
# and get Bulgarian text back, wired into the Share Sheet or Siri. The Gradio web
# UI at stt.<domain>/ also works in mobile Safari.
#
# Models are downloaded on first use into a HuggingFace cache, bind-mounted under
# STORAGE_ROOT so they survive restarts/re-pulls (medium ≈ 1.5 GB on disk). This
# image has no startup-preload knob, so the FIRST transcription downloads the
# model (one-time, a few minutes on CPU); WHISPER__TTL=-1 then keeps it resident
# in RAM instead of unloading after the default 5-min idle, so later requests are
# warm. Warm it once after bring-up with a throwaway request (see .env.example).

services:
  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: speaches
    restart: unless-stopped
    ports:
      - "8093:8000"
    volumes:
      # HuggingFace hub cache (downloaded Whisper models). The -cpu image runs as
      # the in-container `ubuntu` user (uid 1000), which rootless podman maps to a
      # host subuid that does NOT own this STORAGE_ROOT dir — so `:U` tells podman
      # to chown the bind-mount source to the container user on start. Without it
      # the model download fails with EACCES under .cache/huggingface.
      - ${STORAGE_ROOT:-../../data}/speaches:/home/ubuntu/.cache/huggingface/hub:U
      # Custom minimal UI: Speech-to-Text first (no model/language selectors),
      # Text-to-Speech second, Audio Chat removed. Overrides one upstream source
      # file; remove this line to fall back to the stock Playground UI.
      - ./ui/app.py:/home/ubuntu/speaches/src/speaches/ui/app.py:ro
    environment:
      - WHISPER__INFERENCE_DEVICE=cpu
      - WHISPER__COMPUTE_TYPE=int8
      # CTranslate2 threading. Default to the 4 physical cores; hyperthreads
      # rarely help int8 inference and this box runs plenty else. Override per host.
      - WHISPER__CPU_THREADS=${WHISPER_CPU_THREADS:-4}
      # Keep the loaded model resident (don't unload after idle) so repeated
      # requests stay warm. -1 = never unload (default is 300s).
      - WHISPER__TTL=-1
      - ENABLE_UI=${SPEACHES_ENABLE_UI:-true}
      # The web UI calls the API back through the URL it was reached on. Behind
      # Caddy that means the container would hairpin out to https://stt.$DOMAIN
      # and back — small GETs survive but the large transcription POST gets reset
      # (httpx.ReadError, surfaced in the UI as a failure). Pin the UI's internal
      # client to the container's own listener so it never leaves the box.
      - LOOPBACK_HOST_URL=http://localhost:8000
      # Fixed model + language for the custom STT tab (no selectors in the UI).
      # Keep STT_UI_MODEL in sync with the model you installed via POST /v1/models.
      - STT_UI_MODEL=${WHISPER_MODEL:-Systran/faster-whisper-medium}
      - STT_UI_LANGUAGE=${STT_LANGUAGE:-bg}
      - TZ=${TZ:-UTC}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
